# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5cf5c5da943e862cca6f2d343ecf0a53"
name = "storerx"
application_url = "https://storerx.fly.dev"
embedded = true

[access_scopes]
# Read-only. StoreRx recommends changes and the merchant makes them, so it
# never needs write access — asking for it on the install screen would
# contradict the promise. Every query's scope need was checked with the Admin
# API validator; read_products covers all of them.
scopes = "read_products,read_content,read_themes"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Plan approved, cancelled, frozen or expired. Keeps Shop.plan in step.
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/subscriptions/update"
  topics = [ "app_subscriptions/update" ]

  # Mandatory privacy compliance webhooks — required for App Store review.
  # Handled by app/routes/webhooks.gdpr.tsx.
  [[webhooks.subscriptions]]
  uri = "/webhooks/gdpr"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://storerx.fly.dev/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
