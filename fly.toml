app = "storerx"
primary_region = "sjc"

[build]

# Run migrations once per release, before any machine starts. Without this the
# worker could boot on the new code before the app process had migrated.
[deploy]
  release_command = "npx prisma migrate deploy"

# Two process groups from one image. Only `app` serves HTTP; the worker polls
# the Audit table (see app/queue.server.ts).
[processes]
  app = "npm run docker-start"
  worker = "npm run worker:prod"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
