app = "storerx"
primary_region = "sjc"

[build]

# Run migrations once per release, before any machine starts. Without this the
# worker could boot on the new code before the app process had migrated.
[deploy]
  release_command = "npx prisma migrate deploy"

# Two process groups from one image. Only `app` serves HTTP; the worker polls
# the Audit table (see app/queue.server.ts).
[processes]
  # Plain `start`: the Prisma client is generated in the image and migrations
  # run once as the release_command, so re-running them on every boot only
  # added ~17s of cold start (measured in the deploy logs).
  app = "npm run start"
  worker = "npm run worker:prod"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Keep one app machine awake. Shopify gives webhooks a 1s connect and 5s
  # total timeout, which a machine waking from stop cannot meet — and the
  # mandatory compliance webhooks are checked during App Store review.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
